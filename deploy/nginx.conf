limit_req_zone $binary_remote_addr zone=voina_login:10m rate=10r/m;

server {
    listen 80;
    server_name 84.201.155.77;
    return 301 https://voinatitii.84.201.155.77.sslip.io$request_uri;
}

server {
    listen 80;
    server_name voinatitii.84.201.155.77.sslip.io;
    client_max_body_size 6m;
    add_header Referrer-Policy same-origin always;
    location /static/ {
        alias /var/www/voinatitii/static/;
        expires 1h;
    }
    location ~ ^/(login|register)/ {
        limit_req zone=voina_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
